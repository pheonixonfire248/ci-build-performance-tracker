name: CI

on:
  push:
  pull_request:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests and record build time
        run: python scripts/run_timed_tests.py

      - name: Generate delivery report
        if: always()
        run: |
          python scripts/report.py
          cat reports/ci_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build report web page
        run: python scripts/build_site.py

      - name: Upload build data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            data/build_times.csv
            reports/ci_report.md

      - name: Package page for deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test-and-report
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
